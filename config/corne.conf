# Uncomment the following lines to enable the Corne RGB Underglow
# (CONFIG_WS2812_STRIP was renamed upstream to CONFIG_LED_STRIP; the SPI-specific
# WS2812_STRIP_SPI driver auto-enables itself from the devicetree node.)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y


CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000